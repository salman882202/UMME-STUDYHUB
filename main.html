<style>
    .box-contact{
        background: grey;
        height: 100px;
        width: 100%;
        color: white;
        text-align: center;
    }
    h4{
        background: greenyellow;
        align-items: center;
        text-align: center;
    }
    .premium-notice {
  background: #fffbe6;
  border: 2px solid #f0a500;
  text-align: center;
  padding: 2rem;
  margin: 2rem auto;
  border-radius: 19px;
  max-width: 300px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.premium-notice h2 {
  color: #f0a500;
  margin-bottom: 0.5rem;
}

.premium-notice p {
  margin-bottom: 1rem;
  font-size: 1rem;
}

.premium-btn {
  background: #f0a500;
  color: #fff;
  border: none;
  padding: 0.8rem 1.5rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  transition: background 0.3s;
}

.premium-btn:hover {
  background: #d18e00;
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #246b45;
            color: #fff;
            text-align: center;
            padding: 2rem 1rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        .class-btn {
            background: #fff;
            border: 2px solid #246b45;
            text-align: center;
            padding: 1.2rem;
            text-decoration:none;
            font-weight: bold;
            color: #246b45;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .class-btn:hover {
            background: #246b45;
            color: #fff;
            transform: translateY(-3px);
        }

        footer {
            background: #333;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            bottom: 0;
            position: absolute;
            width: 100%;
            color: #f5f7fa;
        }
    </style>
