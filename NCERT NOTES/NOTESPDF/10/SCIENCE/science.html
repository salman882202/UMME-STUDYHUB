<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-widht, initial-scale=1.0">

<body>
    <header>
        <h1>UMME STUDY HUB</h1>
    </header>
    <section download class="class-grid">
        <a href="../SCIENCE/SCI CH 4.pdf" class="box-btn"> CARBON AND ITS COMPOUND</a>
    </section>
    <style>
        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            padding: 2rem;
        }

        .box-btn {
            background: #fff;
            border: 2px solid #2e8b57;
            text-align: center;
            padding: 1.2rem;
            text-decoration: none;
            font-weight: bold;
            color: #2e8b57;
            border-radius: 12px;
            transition: all 0.3s ease;
            height: auto;
            overflow-wrap: break-word;
            overflow: hidden;
            box-sizing: border-box;
        }

        .box-btn:hover {
            background: #2e8b57;
            color: #fff;
            transform: translateY(-3px);
        }

        footer {
            background: #333;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #2e8b57;
            color: #fff;
            text-align: center;
            padding: 2rem 1rem;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
    <footer>
        <p>&copy; 2025 Study Hub | All Rights Reserved</p>
        <p>
        </p>
    </footer>

</body>
</head>

</html>
