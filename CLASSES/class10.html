<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyHub Class 10</title>
</head>

<body>
  <header>
    <h1>Class 10</h1>
  </header>

  <main class="class-grid">
    <a href="../BOOKS/bookspages/10ncertbooks.html" class="class-btn">NCERT books </a>
    <a href="../ADDITIONAL NOTES/CLASSES/10addnotes.html" class="class-btn">Additional Note</a>
  </main>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---------- Header ---------- */
    header {
      background: #2E8B57;
      color: #fff;
      text-align: center;
      padding: 2rem 1rem;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .back-home {
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* ---------- Button Grid ---------- */
    .class-grid {
      display: grid;
      gap: 10px;
      padding: 10px;
      flex: 0;
      /* pushes footer down */
    }

    .class-btn {
      background: #fff8;
      border: 2px solid #2E8B57;
      text-align: center;
      padding: 15px;
      text-decoration: none;
      font-weight: bold;
      color: #2E8B57;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .class-btn:hover {
      background: #2E8B57;
      color: #fff;
      transform: translateY(-3px);
    }

    /* ---------- Footer ---------- */
    footer {
      background: #333;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #f5f7fa;
      bottom: 0;
      width: 100%;
      position: absolute;
    }
  </style>

  <footer>
    <p>© 2025 StudyHub | All Rights Reserved</p>
  </footer>
</body>

</html>
